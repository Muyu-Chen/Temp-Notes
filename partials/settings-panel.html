<div class="modal-panel" id="settingsPanel">
  <div class="panel-header">
    <h2 class="panel-title">设置</h2>
  </div>
  <div class="panel-body">
    <div class="settings-group">
      <div class="settings-item">
        <div class="settings-label">
          <span class="label-name">字体大小</span>
          <span class="label-desc">调整文本显示大小</span>
        </div>
        <div class="font-size-controls">
          <input type="range" id="fontSizeSlider" min="12" max="20" value="16" class="font-slider">
          <span id="fontSizeValue" class="font-size-value">16px</span>
        </div>
      </div>

      <div class="settings-item">
        <div class="settings-label">
          <span class="label-name">界面宽度</span>
          <span class="label-desc">按当前屏幕选择工作区最大宽度</span>
        </div>
        <div class="setting-control">
          <select id="layoutWidthSelect" class="settings-select">
            <option value="standard">标准（1200px）</option>
            <option value="auto">自动适配</option>
            <option value="wide">宽屏（1360px）</option>
            <option value="ultrawide">超宽（1520px）</option>
          </select>
        </div>
      </div>

      <div class="settings-item">
        <div class="settings-label">
          <span class="label-name">左右分栏</span>
          <span class="label-desc">为编辑区或存档列表分配更多空间</span>
        </div>
        <div class="setting-control">
          <select id="columnLayoutSelect" class="settings-select">
            <option value="default">默认比例</option>
            <option value="editor">编辑区优先</option>
            <option value="archive">存档列表优先</option>
          </select>
        </div>
      </div>

      <div class="settings-item">
        <div class="settings-label">
          <span class="label-name">回收站自动清理</span>
          <span class="label-desc" id="recycleRetentionDesc">自动清理：永不</span>
        </div>
        <div class="setting-control">
          <select id="recycleRetentionSelect" class="settings-select">
            <option value="0">永不</option>
            <option value="7">7 天</option>
            <option value="30">30 天</option>
            <option value="90">90 天</option>
          </select>
        </div>
      </div>

      <div class="settings-item">
        <div class="settings-label">
          <span class="label-name">录音与导出格式</span>
          <span class="label-desc">优先使用 M4A/MP3；已有录音不转码，必要时自动回退。</span>
        </div>
        <div class="setting-control">
          <select id="recordingFormatSelect" class="settings-select">
            <option value="m4a">M4A</option>
            <option value="mp3">MP3（浏览器支持时）</option>
            <option value="webm">WebM</option>
          </select>
        </div>
      </div>

      <div class="settings-item settings-item-stack">
        <div class="settings-label">
          <span class="label-name">大模型配置</span>
          <span class="label-desc">默认关闭；只有启用后主动测试或使用 AI 功能时才会请求配置的服务。</span>
        </div>

        <div class="settings-form">
          <label class="llm-toggle-row">
            <input type="checkbox" id="llmEnabled">
            <span>启用大模型功能</span>
          </label>

          <div class="settings-field-grid">
            <label for="llmBaseUrl">Base URL</label>
            <input type="text" id="llmBaseUrl" class="settings-input" placeholder="例如: https://api.openai.com/v1"
              spellcheck="false" autocapitalize="off" autocomplete="off">
          </div>

          <div class="settings-field-grid">
            <label for="llmApiKey">API Key</label>
            <input type="password" id="llmApiKey" class="settings-input" placeholder="例如: sk-..."
              spellcheck="false" autocapitalize="off" autocomplete="off">
          </div>

          <div class="settings-field-grid">
            <label for="llmModel">Model</label>
            <input type="text" id="llmModel" class="settings-input" placeholder="例如: gpt-4.1 或本地模型名"
              spellcheck="false" autocapitalize="off" autocomplete="off">
          </div>

          <div class="settings-actions">
            <button id="llmTestBtn" type="button">测试连接</button>
            <span id="llmStatus" class="llm-status muted small">未测试</span>
          </div>

          <div class="settings-debug-log">
            <div class="settings-debug-log-head">
              <span class="muted small">最近一次 AI 失败日志</span>
              <div class="settings-actions">
                <button id="llmCopyLogBtn" type="button">复制日志</button>
                <button id="llmClearLogBtn" type="button">清除日志</button>
              </div>
            </div>
            <textarea id="llmDebugLog" class="settings-input llm-debug-log" readonly
              placeholder="暂无失败日志"></textarea>
          </div>
        </div>
      </div>

      <div class="settings-item settings-danger-item">
        <div class="settings-label">
          <span class="label-name">清除所有内容</span>
          <span class="label-desc">永久删除所有草稿、条目和回收站数据，无法恢复</span>
        </div>

        <div class="settings-danger-action">
          <button id="btnClearAllData" class="danger settings-danger-button">
            清除所有内容
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
