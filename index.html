<!doctype html>
<html lang="zh-CN" data-default-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>临时笔记（第二桌面）</title>
    <script src="./js/crypto-js.min.js"></script>
    <script src="./js/vendor/jszip.min.js"></script>
    <script src="./js/vendor/purify.min.js"></script>
    <script src="./js/vendor/marked.min.js"></script>
    <script>
      (() => {
        const root = document.documentElement;
        const defaultTheme = root.getAttribute("data-default-theme") || "light";
        let theme = defaultTheme;

        try {
          const storedTheme = localStorage.getItem("tempnotes:theme:v1");
          if (storedTheme === "dark" || storedTheme === "light") {
            theme = storedTheme;
          }
        } catch {}

        root.setAttribute("data-theme", root.getAttribute("data-theme") || theme);
      })();
    </script>

    <!-- 主题系统 -->
    <link rel="stylesheet" href="./css/theme.css" />
    <!-- 基础样式 -->
    <link rel="stylesheet" href="./css/base.css" />
    <!-- 布局组件 -->
    <link rel="stylesheet" href="./css/layout.css" />
    <!-- UI组件 -->
    <link rel="stylesheet" href="./css/components.css" />
  </head>

  <body>
    <div class="app" id="app">
      <header>
        <div class="title">
          <div class="title-row">
            <h1>临时笔记（第二桌面）</h1>
            <a
              class="title-link"
              href="https://github.com/Muyu-Chen/Temp-Notes"
              target="_blank"
              rel="noreferrer"
            >
              GitHub
            </a>
          </div>
          <div class="sub">
            <span class="pill"
              >自动保存：<span id="autosaveState">就绪</span></span
            >
            <span class="pill">草稿字数：<span id="wc">0</span></span>
            <span class="pill">草稿占用：<span id="draftUsage">0 KB</span></span>
          </div>
        </div>

        <div class="actions">
          <button
            class="primary"
            id="btnArchive"
            title="把当前草稿保存为一个条目（不清空草稿）"
          >
            存档 <span class="kbd">Ctrl</span>+<span class="kbd">S</span>
          </button>
          <button id="btnNew" title="新建草稿（可选择是否保存当前草稿）">新建</button>
          <button id="btnCopy" title="复制草稿到剪贴板">复制草稿</button>
          <button
            id="btnClearDraft"
            class="danger"
            title="清空草稿（不可恢复）"
          >
            清空草稿 <span class="kbd">Ctrl</span>+<span class="kbd">L</span>
          </button>
          <button id="btnTheme" title="切换明/暗色">主题</button>
        </div>
      </header>

      <div class="main">
        <!-- Draft -->
        <section class="panel">
          <div class="panel-head">
            <div class="label">
              <span>草稿区（自动保存）</span>
              <span class="muted small">打开即用 重开仍在</span>
            </div>
            <div class="right">
              <div id="draftModeToggle" class="mode-toggle" data-mode="edit" aria-label="草稿显示模式">
                <button id="btnMarkdownEdit" class="active" type="button">编辑</button>
                <button id="btnMarkdownPreview" type="button">预览</button>
              </div>
              <button
                id="btnRecordDraft"
                class="record-draft-btn"
                type="button"
                title="开始录音"
              >
                <span class="record-dot" aria-hidden="true"></span>
                <span>录音</span>
              </button>
              <!-- 快捷键提示 目前我觉得可以暂时不显示 -->
              <!-- 
              <span class="muted small"
                >快捷键：<span class="kbd">Ctrl</span>+<span class="kbd">S</span>
                存档，<span class="kbd">Ctrl</span>+<span class="kbd">K</span>
                搜索，<span class="kbd">Ctrl</span>+<span class="kbd">L</span>
                清空</span
              >
            -->
            </div>
          </div>
          <textarea
            id="draft"
            spellcheck="false"
            placeholder="把这里当作你的“第二桌面”。随手粘贴、临时记录、快速中转…&#10;&#10;提示：所有内容均自动保存，若需要在右侧存档就点“存档”或Ctrl+S。"
          ></textarea>
          <div id="draftPreview" class="draft-preview markdown-body" hidden></div>
          <div
            id="draftAttachments"
            class="draft-attachments"
            aria-label="草稿录音附件"
            hidden
          ></div>
        </section>

        <!-- Archive -->
        <section class="panel archive-panel">
          <div class="panel-head" style="gap: 8px; flex-wrap: wrap">
            <div class="label" style="flex: 1; min-width: 200px">
              <div class="muted small" style="display:flex; gap:12px; flex-wrap:wrap; margin-top:1px;">
                <span>存档条目：<span id="countItems">0</span></span>
                <span>总占用估算：<span id="usage">0 KB</span></span>
              </div>
            </div>
            <div class="right archive-search-area" style="flex: 1; min-width: 220px">
              <div class="archive-search-tools" id="archiveSearchTools">
                <input
                  id="search"
                  class="search"
                  placeholder="搜索条目（Ctrl+K）"
                />
                <button
                  id="archiveFilterToggleBtn"
                  class="archive-filter-toggle"
                  type="button"
                  aria-label="展开筛选"
                  aria-expanded="false"
                  aria-controls="archiveFilterMenu"
                  title="展开筛选"
                >
                  ▾
                </button>
                <div id="archiveFilterMenu" class="archive-filter-menu" hidden aria-label="存档筛选">
                  <button id="favoriteFilterBtn" type="button" title="只看收藏条目">收藏</button>
                  <button type="button" disabled title="稍后实现">按名字排序</button>
                  <button type="button" disabled title="稍后实现">时间段筛选</button>
                  <button id="activeTagFilterBtn" type="button" hidden title="清除标签筛选">
                    标签：<span id="activeTagFilterText"></span>
                  </button>
                </div>
              </div>
            </div>
            <div class="right">
              <button
                id="btnMore"
                title="打开更多功能"
              >
                更多
              </button>
            </div>
          </div>

          <div class="list" id="list"></div>
        </section>
      </div>
    </div>

    <div class="toast" id="toast"></div>

    <section
      id="recordingFloatingPanel"
      class="recording-floating-panel"
      aria-label="录音控制"
      hidden
    >
      <div id="recordingDragHandle" class="recording-floating-head">
        <div class="recording-status">
          <span class="recording-status-dot" aria-hidden="true"></span>
          <div class="recording-status-texts">
            <div id="recordingStatusText" class="recording-state">录音中</div>
            <div class="recording-hint">当前草稿</div>
          </div>
        </div>
        <div id="recordingTimer" class="recording-timer">00:00</div>
      </div>
      <div class="recording-actions">
        <button id="btnRecordingPause" type="button">暂停</button>
        <button id="btnRecordingStop" class="danger" type="button">结束</button>
      </div>
    </section>

    <section
      id="attachmentPlayerPanel"
      class="attachment-player-panel"
      aria-label="录音播放器"
      tabindex="-1"
      hidden
    >
      <div id="attachmentPlayerDragHandle" class="attachment-player-head">
        <div class="attachment-player-title-wrap">
          <div id="attachmentPlayerName" class="attachment-player-name">录音</div>
          <div id="attachmentPlayerMeta" class="attachment-player-meta">00:00 · 0 B</div>
        </div>
        <button id="attachmentPlayerClose" class="attachment-player-close" type="button" title="关闭">
          ×
        </button>
      </div>
      <div class="attachment-player-body">
        <div id="attachmentPlayerWaveform" class="attachment-player-waveform" aria-label="声音强度"></div>
        <input
          id="attachmentPlayerSeek"
          class="attachment-player-seek"
          type="range"
          min="0"
          max="1000"
          value="0"
          aria-label="录音进度"
        />
        <div class="attachment-player-time">
          <span id="attachmentPlayerCurrentTime">00:00</span>
          <span id="attachmentPlayerDuration">00:00</span>
        </div>
      </div>
      <div class="attachment-player-actions">
        <button id="attachmentPlayerPlay" class="attachment-player-play" type="button" title="播放录音">
          ▶
        </button>
        <button id="attachmentPlayerSpeed" class="attachment-player-speed" type="button">1x</button>
        <button id="attachmentPlayerTranscribe" type="button">转录</button>
        <button id="attachmentPlayerExport" type="button">导出</button>
        <button id="attachmentPlayerMore" class="attachment-player-more" type="button">更多</button>
      </div>
    </section>

    <!-- 更多功能面板（仿ChatGPT设置面板） -->
    <div class="modal-overlay" id="moreModalOverlay" style="display: none;"></div>
    <div class="more-modal" id="moreModal" style="display: none;">
      <!-- 顶部Header -->
      <header class="modal-header">
        <div class="header-title">更多功能</div>
        <button class="modal-close-btn" id="moreModalClose" aria-label="关闭">✕</button>
      </header>

      <!-- 主容器：左侧导航 + 右侧内容 -->
      <div class="modal-body">
        <!-- 左侧导航栏 -->
        <div class="modal-sidebar">
          <div class="sidebar-menu">
            <button class="sidebar-item active" id="sidebarRecycle" data-panel="recycle">
              <span class="sidebar-icon">🗑️</span>
              <span class="sidebar-label">回收站</span>
            </button>
            <button class="sidebar-item" id="sidebarImportExport" data-panel="importExport">
              <span class="sidebar-icon">📤</span>
              <span class="sidebar-label">导入/导出</span>
            </button>
            <button class="sidebar-item" id="sidebarSettings" data-panel="settings">
              <span class="sidebar-icon">⚙️</span>
              <span class="sidebar-label">设置</span>
            </button>
          </div>
        </div>

        <!-- 右侧内容区 -->
        <div class="modal-content">
          <!-- 回收站面板 -->
          <div class="modal-panel active" id="recyclePanel">
            <div class="panel-header">
              <h2 class="panel-title">回收站</h2>
              <input type="text" id="recycleSearch" class="search" placeholder="搜索已删除的条目..." style="width: 100%; margin-top: 8px;">
              <div id="recycleRetentionStatus" class="recycle-retention-status muted small">自动清理：永不</div>
            </div>
            <div class="panel-body">
              <div class="recycle-list" id="recycleList"></div>
              <div class="recycle-actions" id="recycleActions" style="display: none;">
                <button class="btn-danger" id="recycleClearAll">清空所有</button>
              </div>
            </div>
          </div>

          <!-- 导入/导出面板 -->
          <div class="modal-panel" id="importExportPanel">
            <div class="panel-header">
              <h2 class="panel-title">导入/导出</h2>
            </div>
            <div class="panel-body">
              <div class="import-export-grid">
                <button class="import-export-btn" id="exportBtn">
                  <div class="btn-icon">📥</div>
                  <div class="btn-title">导出为 ZIP</div>
                  <div class="btn-desc">包含 notes.json 和录音文件</div>
                </button>
                <button class="import-export-btn" id="importBtn">
                  <div class="btn-icon">📤</div>
                  <div class="btn-title">导入 JSON / ZIP</div>
                  <div class="btn-desc">兼容旧 JSON 与新版 ZIP 备份</div>
                </button>
              </div>
            </div>
          </div>

          <!-- 设置面板 -->
          <div id="settingsPanelMount" data-partial="./partials/settings-panel.html"></div>
        </div>
      </div>
    </div>

    <!-- 应用主入口 -->
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
